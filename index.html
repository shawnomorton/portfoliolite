<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Portfolio</title>
<meta name="description" content="Photography portfolio.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%23111%27/%3E%3C/svg%3E">
</head>
<body>
<header class="site-header"></header>
<main>
  <section id="cycler" class="cycler" aria-live="off"></section>
  <section class="index" id="work">
    <a id="projects" class="visually-hidden" aria-hidden="true"></a>
    <h2>Projects</h2>
    <div class="series-grid" id="series-grid"></div>
  </section>
  <!-- Used only when singlePage is true in js/config.js -->
  <div id="series-view" hidden>
    <header class="series-head" id="series-head"></header>
    <section id="feed" class="feed"></section>
    <nav class="series-nav" id="series-nav" aria-label="Other series"></nav>
  </div>
  <section class="archive" id="archive" hidden><h1>Archive</h1><div class="wall" id="archive-wall"></div></section>
  <section class="info" id="info" hidden></section>
</main>
<footer class="site-footer"></footer>
<script src="js/config.js"></script>
<script src="data/manifest.js"></script>
<script src="js/app.js"></script>
</body>
</html>
